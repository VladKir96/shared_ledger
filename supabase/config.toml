minimum_password_length = 8
site_url = "sharedledger://auth/confirm"
additional_redirect_urls = ["sharedledger://auth/confirm", "sharedledger://auth/recovery"]

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.delete-account]
verify_jwt = false
